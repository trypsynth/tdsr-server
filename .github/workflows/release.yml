name: Release
on:
  push:
    tags: ['v*']
  # Running it by hand builds both exes without publishing a release.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/tdsr-server.exe tdsr-server-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v7
        with:
          name: tdsr-server-${{ matrix.arch }}
          path: tdsr-server-${{ matrix.arch }}.exe
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: tdsr-server ${{ github.ref_name }}
          files: artifacts/*.exe
