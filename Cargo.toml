[package]
name = "tdsr-server"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/trypsynth/tdsr-server"
rust-version = "1.90"

[dependencies]
native-dialog = "0.9.7"
# Static, so prism is built into the exe and nothing has to ship beside it.
prismer = { version = "0.1.6", features = ["static"] }
tao = { version = "0.37.3", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
